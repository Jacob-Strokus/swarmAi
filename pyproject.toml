[project]
name = "swamai"
version = "0.1.0"
description = "Build AI swarms for search, intrusion detection, and authorized security testing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jacob Strokus" }]
dependencies = []

[project.optional-dependencies]
remote = ["httpx>=0.27"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
swarm = "swarm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swarm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
